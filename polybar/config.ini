[colors]
bg         = #282828
bg-alt     = #3c3836
fg         = #ebdbb2
fg-dim     = #928374
red        = #cc241d
orange     = #d65d0e
yellow     = #fabd2f
green      = #b8bb26
teal       = #8ec07c
blue       = #83a598
purple     = #d3869b
aqua       = #689d6a

[bar/main]
width       = 100%
height      = 28
offset-y    = 0
radius      = 0
fixed-center = true
background  = ${colors.bg}
foreground  = ${colors.fg}
line-size   = 2
padding-left  = 1
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font:pixelsize=12;2
font-1 = JetBrainsMono Nerd Font:pixelsize=14;3

modules-left   = i3 xwindow
modules-center = cpu memory
modules-right  = battery date time

[module/i3]
type            = internal/i3
format          = <label-state> <label-mode>
index-sort      = true
wrapping-scroll = false

label-focused            = %index%
label-focused-background = ${colors.blue}
label-focused-foreground = ${colors.bg}
label-focused-padding    = 2

label-unfocused          = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding  = 2

label-visible            = %index%
label-visible-foreground = ${colors.fg}
label-visible-padding    = 2

label-urgent             = %index%
label-urgent-background  = ${colors.red}
label-urgent-foreground  = ${colors.bg}
label-urgent-padding     = 2

[module/xwindow]
type   = internal/xwindow
label  = %{F#fabd2f}%title:0:50:...%%{F-}

[module/cpu]
type             = internal/cpu
interval         = 2
format-prefix    = "%{F#b8bb26}⬡%{F-} "
label            = %percentage%%

[module/memory]
type             = internal/memory
interval         = 2
format-prefix    = "%{F#83a598}▣%{F-} "
label            = %gb_used%

[module/battery]
type                        = internal/battery
battery                     = BAT0
adapter                     = AC
full-at                     = 98
poll-interval               = 5

; Iconos Nerd Font — barra que se vacía
format-charging    = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = %{F#8ec07c}󰁹%{F-} <label-full>

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full        = Cargada

; Niveles de batería descargando (mismo orden que los iconos)
ramp-capacity-0 = %{F#cc241d}󰁺%{F-}
ramp-capacity-1 = %{F#d65d0e}󰁻%{F-}
ramp-capacity-2 = %{F#d65d0e}󰁼%{F-}
ramp-capacity-3 = %{F#fabd2f}󰁽%{F-}
ramp-capacity-4 = %{F#fabd2f}󰁾%{F-}
ramp-capacity-5 = %{F#b8bb26}󰁿%{F-}
ramp-capacity-6 = %{F#b8bb26}󰂀%{F-}
ramp-capacity-7 = %{F#b8bb26}󰂁%{F-}
ramp-capacity-8 = %{F#8ec07c}󰂂%{F-}
ramp-capacity-9 = %{F#8ec07c}󰂃%{F-}

; Animación al cargar
animation-charging-0         = %{F#83a598}󰢜%{F-}
animation-charging-1         = %{F#83a598}󰂆%{F-}
animation-charging-2         = %{F#83a598}󰂇%{F-}
animation-charging-3         = %{F#83a598}󰂈%{F-}
animation-charging-4         = %{F#83a598}󰂄%{F-}
animation-charging-framerate = 750

[module/date]
type     = internal/date
interval = 60
date     = %{F#d3869b}%a %d %b%{F-}
label    = %date%

[module/time]
type     = internal/date
interval = 1
date     = %H:%M
label    = %date%
